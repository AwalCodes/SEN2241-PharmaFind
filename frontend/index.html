<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharma-Find Frontend</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Pharma-Find</h1>
        <p class="subtitle">Search medicine availability and manage stock updates.</p>
        <div class="top-actions">
          <button id="pharmacist-login-btn" type="button">Pharmacist Login</button>
          <span id="login-status" class="hint-text">Not logged in</span>
        </div>
      </header>

      <div id="login-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Pharmacist Login</h2>
          <form id="login-form">
            <label for="login-username">Username</label>
            <input id="login-username" type="text" required />
            <label for="login-password">Password</label>
            <input id="login-password" type="password" required />
            <div class="modal-actions">
              <button type="submit">Login</button>
              <button id="close-login-btn" type="button" class="secondary-btn">Close</button>
            </div>
          </form>
          <div id="login-result" class="message-box"></div>
        </div>
      </div>

      <div class="grid-layout" id="dashboard">
        <section class="card card-wide">
          <div class="card-top">
            <h2>All Pharmacies</h2>
            <button id="refresh-btn" type="button">Refresh</button>
          </div>
          <div id="pharmacy-list"></div>
        </section>

        <section class="card">
          <h2>Search Medication</h2>
          <form id="search-form">
            <label for="med-name">Medication name</label>
            <input id="med-name" type="text" placeholder="Paracetamol" required />
            <button type="submit">Search</button>
          </form>
          <div id="search-result"></div>
        </section>

        <section class="card">
          <h2>Update Stock (Pharmacist)</h2>
          <p class="hint-text">Login is required for stock updates.</p>
          <form id="stock-form">
            <label for="stock-pharmacy-id">Pharmacy</label>
            <select id="stock-pharmacy-id" required></select>

            <label for="stock-med-name">Medication</label>
            <select id="stock-med-name" required></select>

            <label for="new-qty">New quantity</label>
            <input id="new-qty" type="number" min="0" value="20" required />

            <button type="submit">Update Stock</button>
          </form>
          <div id="stock-result" class="message-box"></div>
        </section>

        <section class="card">
          <h2>Add New Pharmacy</h2>
          <p class="hint-text">Login is required to add a pharmacy.</p>
          <form id="add-pharmacy-form">
            <label for="new-pharmacy-name">Pharmacy name</label>
            <input id="new-pharmacy-name" type="text" placeholder="NewCare Pharmacy" required />

            <label for="new-pharmacy-address">Location / Address</label>
            <input id="new-pharmacy-address" type="text" placeholder="22 King Street" required />

            <label for="new-pharmacy-medication">First medication</label>
            <input id="new-pharmacy-medication" type="text" placeholder="Vitamin C" required />

            <label for="new-pharmacy-quantity">First quantity</label>
            <input id="new-pharmacy-quantity" type="number" min="0" value="10" required />

            <button type="submit">Add Pharmacy</button>
          </form>
          <div id="add-pharmacy-result" class="message-box"></div>
        </section>

        <section class="card card-wide">
          <h2>Medications in Selected Pharmacy</h2>
          <form id="view-meds-form">
            <label for="view-pharmacy-id">Pharmacy</label>
            <select id="view-pharmacy-id" required></select>
            <button type="submit">View Medications</button>
          </form>
          <div id="pharmacy-meds-result"></div>
        </section>
      </div>
    </main>

    <script src="/frontend/app.js"></script>
  </body>
</html>
